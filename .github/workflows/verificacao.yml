name: Verificação

# A suíte numérica roda sem a stack gráfica (ver tests/conftest.py),
# o que permite verificá-la num contêiner mínimo. A matriz com e sem `numba` existe
# porque o programa alterna entre dois kernels de balanço hídrico conforme a
# biblioteca esteja instalada: sem essa matriz, a paridade entre eles só seria
# verificada sob demanda, e foi justamente uma divergência entre kernels o defeito
# mais sutil encontrado na auditoria.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  nucleo:
    name: Núcleo de cálculo (${{ matrix.kernel }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # A suíte tem ~1.240 testes e leva de 3 a 15 minutos por job. O limite folgado
    # evita cortar a suíte num executor lento e ainda impede que uma fonte externa
    # lenta (a ANEEL, nos testes de rede) prenda a verificação por horas.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        kernel: [python, jit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências do núcleo
        run: |
          python -m pip install --upgrade pip
          # PySide6 fica de fora: os módulos de interface não são coletados sem Qt.
          # matplotlib e pypdf entram para os testes das figuras e dos PDFs do manual.
          pip install numpy pandas openpyxl reportlab pydantic ezdxf requests beautifulsoup4 pyarrow matplotlib pypdf
          pip install pytest pytest-cov

      - name: Instalar o kernel acelerado
        if: matrix.kernel == 'jit'
        run: pip install "numba>=0.62"

      - name: Registrar o ambiente
        run: |
          python -c "from netuno.core import simulation; print('HAS_NUMBA =', simulation.HAS_NUMBA)"
          python -c "import numpy, pandas; print('numpy', numpy.__version__, '| pandas', pandas.__version__)"

      - name: Verificar que o kernel esperado está ativo
        run: |
          python - <<'PY'
          import sys
          from netuno.core import simulation
          esperado = "${{ matrix.kernel }}" == "jit"
          if simulation.HAS_NUMBA != esperado:
              sys.exit(f"kernel inesperado: HAS_NUMBA={simulation.HAS_NUMBA}, esperado {esperado}")
          print("kernel conforme a matriz")
          PY

      # Os testes marcados "rede" ficam fora da execução local padrão (pyproject.toml),
      # mas os executores do GitHub têm internet: aqui eles rodam, consultando a
      # ANEEL de fato, e contam para a cobertura do atualizador tarifário.
      #
      # A cobertura é medida uma vez, no job Python puro 3.13, que tem o portão de
      # 80%. Sob cobertura, as simulações em Python puro ficam até 20 vezes mais
      # lentas (3 s viram 68 s num único teste), e no 3.12 isso levava o job a
      # passar de 40 minutos; os demais jobs rodam a mesma suíte sem ela.
      # O -m explícito substitui o do addopts do pyproject.toml, e por isso repete
      # o «not rede»: os testes de rede baixam ~90 MB da ANEEL e rodam só sob
      # demanda (pytest -m rede, ou o job «Fontes oficiais» disparado à mão).
      - name: Suíte de verificação
        if: ${{ !(matrix.kernel == 'python' && matrix.python == '3.13') }}
        run: python -m pytest -m "not replicacao and not rede" --durations=15

      - name: Suíte de verificação com portão de cobertura
        if: matrix.kernel == 'python' && matrix.python == '3.13'
        run: python -m pytest -m "not replicacao and not rede" --durations=15 --cov=netuno.core --cov-report=term-missing --cov-fail-under=80

  replicacao:
    name: Replicação contra o Netuno 4
    runs-on: ubuntu-latest
    # Os jobs levam poucos minutos; um limite curto impede que uma fonte externa
    # lenta (a ANEEL, nos testes de rede) prenda a verificação por horas.
    timeout-minutes: 20
    # A comparação percorre 4.050 casos de referência. Com o kernel acelerado leva
    # cerca de dois minutos; sem ele, mais de dez. Roda apenas no push para main.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas openpyxl reportlab pydantic ezdxf requests beautifulsoup4 pyarrow matplotlib pypdf
          pip install pytest "numba>=0.62"

      - name: Aderência de replicação
        run: python -m pytest -m replicacao -v

      - name: Decomposição da divergência
        run: python tests/benchmarking/decomposicao_divergencia.py

  rede:
    name: Fontes oficiais (ANEEL)
    runs-on: ubuntu-latest
    # Só quando pedido: Actions → Verificação → Run workflow. Nunca em push ou PR.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas openpyxl reportlab pydantic ezdxf requests beautifulsoup4 pyarrow matplotlib pypdf
          pip install pytest

      - name: Testes de rede
        run: python -m pytest -m rede -v
