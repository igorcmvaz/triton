name: Verificação

# Um repositório, três edições (triton_brl, triton_int, triton_ibe). Cada edição roda a
# própria suíte, na própria pasta. A suíte numérica roda sem a stack gráfica (ver
# tests/conftest.py). A matriz com e sem `numba` existe porque o programa alterna entre
# dois kernels de balanço hídrico conforme a biblioteca esteja instalada: sem ela, a
# paridade entre eles só seria verificada sob demanda.

on:
  push:
    branches: [main, revisao-geral, monorepo-triton]
  pull_request:
    branches: [main, revisao-geral, monorepo-triton]
  workflow_dispatch:

permissions:
  contents: read

# Um push novo cancela a verificação anterior da mesma ramificação.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: ${{ matrix.dir }} (${{ matrix.kernel }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Limite folgado: a suíte leva de 3 a 15 minutos por job e uma fonte externa lenta
    # não pode prender a verificação por horas.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      TRITON_EDITION: ${{ fromJSON('{"triton_brl":"BRL","triton_int":"INT","triton_ibe":"IBE"}')[matrix.dir] }}
    strategy:
      fail-fast: false
      matrix:
        dir: [triton_brl, triton_int, triton_ibe]
        python: ["3.12", "3.13"]
        kernel: [python, jit]
        exclude:
          # O kernel acelerado é conferido uma vez, na versão mais nova.
          - python: "3.12"
            kernel: jit
    steps:
      # Só a pasta da edição: a Brasil leva a base CLIMBra versionada (19 bancos, ~785 MB),
      # que as outras duas não precisam baixar.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ${{ matrix.dir }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependências do núcleo
        run: |
          python -m pip install --upgrade pip
          # PySide6 fica de fora: os módulos de interface não são coletados sem Qt.
          pip install numpy pandas openpyxl reportlab ezdxf pyarrow matplotlib pypdf
          pip install pytest pytest-cov

      - name: Instalar o kernel acelerado
        if: matrix.kernel == 'jit'
        run: pip install "numba>=0.62"

      - name: Verificar que o kernel esperado está ativo
        run: |
          python - <<'PY'
          import sys
          from triton.core import simulation
          esperado = "${{ matrix.kernel }}" == "jit"
          if simulation.HAS_NUMBA != esperado:
              sys.exit(f"kernel inesperado: HAS_NUMBA={simulation.HAS_NUMBA}, esperado {esperado}")
          print("kernel conforme a matriz")
          PY

      # O -m explícito repete o «not replicacao and not rede» do pyproject.toml (um -m na linha de
      # comando substitui o do addopts).
      - name: Suíte de verificação
        run: python -m pytest -m "not replicacao and not rede" --durations=15

  # A base CLIMBra (um banco por modelo, data/climbra_<modelo>.db) está no Git. Este job confere que
  # os 19 arquivos estão íntegros (SHA-256 do manifesto data/climbra_partes.json, contagem de séries) e
  # que nenhum passa do limite de 100 MB do GitHub. Sem script de apoio: é o teste
  # test_as_partes_reais_batem_com_o_manifesto, do mesmo arquivo que cobre o leitor das partes.
  base-climatica:
    name: Base CLIMBra (BRL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: triton_brl
    env:
      TRITON_EDITION: BRL
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            triton_brl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas openpyxl pytest
      - name: Conferir as partes
        run: python -m pytest tests/unit/test_climbra_particionada.py -k "reais" -p no:cacheprovider
