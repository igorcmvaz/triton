name: Verificação

# Um repositório, três edições (triton_brl, triton_int, triton_ibe). Os jobs vêm em três grupos,
# pelo prefixo do nome:
#
#   Núcleo / …           a suíte numérica de cada edição, sem a stack gráfica (ver tests/conftest.py),
#                        com e sem `numba` (o programa alterna entre dois kernels de balanço hídrico
#                        conforme a biblioteca esteja instalada).
#   Interface Linux / …  a suíte essencial da interface (tests/test_essencial_interface.py) com Qt, em
#                        Ubuntu 22.04: a mesma base do AppImage, que precisa rodar em distribuições
#                        com glibc 2.35 ou mais nova.
#   Dados / …            a base CLIMBra versionada e o tamanho dos arquivos rastreados.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um push novo cancela a verificação anterior da mesma ramificação.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Núcleo / ${{ matrix.dir }} (${{ matrix.kernel }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Limite folgado: a suíte leva de 3 a 15 minutos por job e uma fonte externa lenta
    # não pode prender a verificação por horas.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      TRITON_EDITION: ${{ fromJSON('{"triton_brl":"BRL","triton_int":"INT","triton_ibe":"IBE"}')[matrix.dir] }}
    strategy:
      fail-fast: false
      matrix:
        dir: [triton_brl, triton_int, triton_ibe]
        python: ["3.12", "3.13"]
        kernel: [python, jit]
        exclude:
          # O kernel acelerado é conferido uma vez, na versão mais nova.
          - python: "3.12"
            kernel: jit
    steps:
      # Só a pasta da edição: a Brasil leva a base CLIMBra versionada (19 bancos, ~785 MB),
      # que as outras duas não precisam baixar.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ${{ matrix.dir }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependências do núcleo
        run: |
          python -m pip install --upgrade pip
          # PySide6 fica de fora: os módulos de interface não são coletados sem Qt.
          pip install numpy pandas openpyxl reportlab ezdxf pyarrow matplotlib pypdf
          pip install pytest pytest-cov

      - name: Instalar o kernel acelerado
        if: matrix.kernel == 'jit'
        run: pip install "numba>=0.62"

      - name: Verificar que o kernel esperado está ativo
        run: |
          python - <<'PY'
          import sys
          from triton.core import simulation
          esperado = "${{ matrix.kernel }}" == "jit"
          if simulation.HAS_NUMBA != esperado:
              sys.exit(f"kernel inesperado: HAS_NUMBA={simulation.HAS_NUMBA}, esperado {esperado}")
          print("kernel conforme a matriz")
          PY

      # O -m explícito repete o «not replicacao and not rede» do pyproject.toml (um -m na linha de
      # comando substitui o do addopts).
      - name: Suíte de verificação
        run: python -m pytest -m "not replicacao and not rede" --durations=15

  # A interface em Linux, sem tela (Qt offscreen). Ubuntu 22.04 de propósito: é a base do AppImage.
  # As bibliotecas do apt são as que o Qt 6 (plataforma xcb) e o QtWebEngine (Chromium) pedem e que
  # a imagem do runner não traz; fonts-noto-cjk cobre os textos em chinês.
  interface-linux:
    name: Interface Linux / ${{ matrix.dir }} (Ubuntu 22.04, Python 3.13)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      TRITON_EDITION: ${{ fromJSON('{"triton_brl":"BRL","triton_int":"INT","triton_ibe":"IBE"}')[matrix.dir] }}
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
      # Uma queda nativa (falha de segmentação, erro de barramento) imprime a pilha Python.
      PYTHONFAULTHANDLER: "1"
    strategy:
      fail-fast: false
      matrix:
        dir: [triton_brl, triton_int, triton_ibe]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ${{ matrix.dir }}

      - name: Bibliotecas do sistema para o Qt
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libasound2 fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar o programa e a interface
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab pypdf pytest

      - name: Qt carrega no Linux
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          import PySide6, PySide6.QtWebEngineWidgets  # noqa: F401
          app = QApplication([])
          print("PySide6", PySide6.__version__, "plataforma", app.platformName())
          PY

      # O uso de quem tem o programa: abre a janela como o main.py, exporta um laudo em PDF (que cria
      # uma página do QtWebEngine), fecha a janela e sai. O código de saída tem de ser 0.
      - name: Abrir, exportar um PDF e fechar o programa
        run: |
          cat > /tmp/abrir_e_fechar.py <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from PySide6.QtCore import QCoreApplication, Qt, QTimer
          from PySide6.QtWidgets import QApplication
          QCoreApplication.setAttribute(Qt.AA_ShareOpenGLContexts)
          app = QApplication([sys.argv[0]])
          from triton.ui.main_window import MainWindow
          from triton.core.reporting.report_generator import save_pdf_report
          janela = MainWindow()
          janela.show()
          def exportar():
              save_pdf_report("/tmp/laudo.pdf", "<html><body><h1>Triton</h1><p>teste</p></body></html>")
              print("PDF:", os.path.getsize("/tmp/laudo.pdf") if os.path.exists("/tmp/laudo.pdf") else "ausente", flush=True)
          QTimer.singleShot(1500, exportar)
          QTimer.singleShot(6000, janela.close)
          QTimer.singleShot(7000, app.quit)
          codigo = app.exec()
          print("app.exec terminou com", codigo, flush=True)
          sys.exit(codigo)
          PY
          set +e
          python /tmp/abrir_e_fechar.py
          codigo=$?
          echo "código de saída do programa: $codigo"
          exit $codigo

      - name: Suíte essencial da interface
        if: always()
        run: python -m pytest tests/test_essencial_interface.py -p no:cacheprovider -rfE --durations=15

  # A base CLIMBra (um banco por modelo, data/climbra_<modelo>.db) está no Git. Este job confere que
  # os 19 arquivos estão íntegros (SHA-256 do manifesto data/climbra_partes.json, contagem de séries) e
  # que nenhum passa do limite do projeto (50 MiB; o do GitHub é 100 MiB). Sem script de apoio: é o
  # teste test_as_partes_reais_batem_com_o_manifesto, do mesmo arquivo que cobre o leitor das partes.
  base-climatica:
    name: Dados / Base CLIMBra (BRL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: triton_brl
    env:
      TRITON_EDITION: BRL
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            triton_brl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas openpyxl pytest
      - name: Conferir as partes
        run: python -m pytest tests/unit/test_climbra_particionada.py -k "reais" -p no:cacheprovider

  # Nenhum arquivo rastreado passa de 50 MiB (limite do projeto, mais rígido que os 100 MiB do GitHub).
  # Roda scripts/verificar_tamanhos.py, que imprime o resumo por pasta e falha se algum arquivo passar.
  # Checkout completo (sem sparse): o script mede os arquivos da árvore inteira, as três edições.
  tamanhos:
    name: Dados / Tamanho dos arquivos rastreados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verificar tamanhos
        run: python scripts/verificar_tamanhos.py --limite-mib 50 --aviso-mib 45
