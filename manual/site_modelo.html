<style>

      <input id="busca" type="search" placeholder="Buscar no manual" autocomplete="off" aria-label="Buscar no manual">

<script>
const DADOS = /*__DADOS__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (v, d = 0) => Number(v).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d});
const CORES = {};
DADOS.volumes.forEach(v => { CORES[v.capitulo] = v.cor; });
const SECOES = [];
DADOS.capitulos.forEach(c => c.secoes.forEach(s => SECOES.push(Object.assign({cap: c}, s))));
const POR_ID = Object.fromEntries(SECOES.map(s => [s.id, s]));
const corDe = c => CORES[c.n] || "#4ea8de";

/* navegação principal */
const NAV = [["Início", "#/"], ["Comece aqui", "#/1.1"], ["Tutorial", "#/4.1"], ["Método", "#/2.1"], ["Guias", "#/3.1"], ["Apêndices", "#/A"]];
$("#nav").innerHTML = NAV.map(([t, h]) => `<a href="${h}" data-h="${h}">${t}</a>`).join("");

/* tema */
(function () {
  let salvo = null;
  try { salvo = localStorage.getItem("netuno-tema"); } catch (e) {}
  if (salvo) document.documentElement.setAttribute("data-theme", salvo);
  $("#tema").addEventListener("click", () => {
    const atual = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const novo = atual === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", novo);
    try { localStorage.setItem("netuno-tema", novo); } catch (e) {}
    if (location.hash === "" || location.hash === "#/") desenharCurva();
  });
})();

$("#menu-btn").addEventListener("click", () => { const l = $(".lateral"); if (l) l.classList.toggle("aberta"); });

/* busca */
const INDICE = SECOES.map(s => ({s, t: (s.rotulo + " " + s.titulo).toLowerCase(), x: s.texto.toLowerCase()}));
const semAcento = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "");
INDICE.forEach(i => { i.tn = semAcento(i.t); i.xn = semAcento(i.x); });
let selecionado = -1;
function buscar(q) {
  const caixa = $("#resultados");
  const termos = semAcento(q.toLowerCase()).split(/\s+/).filter(t => t.length > 1);
  if (!termos.length) { caixa.hidden = true; return; }
  const achados = [];
  INDICE.forEach(i => {
    let pontos = 0;
    for (const t of termos) {
      const noTitulo = i.tn.includes(t), noTexto = i.xn.split(t).length - 1;
      if (!noTitulo && !noTexto) { pontos = 0; break; }
      pontos += (noTitulo ? 20 : 0) + Math.min(noTexto, 12);
    }
    if (pontos) achados.push([pontos, i]);
  });
  achados.sort((a, b) => b[0] - a[0]);
  selecionado = -1;
  if (!achados.length) { caixa.innerHTML = `<div class="vazio">Nada encontrado para «${esc(q)}».</div>`; caixa.hidden = false; return; }
  caixa.innerHTML = achados.slice(0, 9).map(([, i]) => {
    const pos = i.xn.indexOf(termos[0]);
    let trecho = pos >= 0 ? i.s.texto.slice(Math.max(0, pos - 60), pos + 120) : i.s.texto.slice(0, 160);
    trecho = esc(trecho);
    termos.forEach(t => {
      const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      trecho = trecho.replace(re, "<mark>$1</mark>");
    });
    return `<a href="#/${i.s.id}"><b>${esc(i.s.rotulo)} · ${esc(i.s.titulo)}</b><span>…${trecho}…</span></a>`;
  }).join("");
  caixa.hidden = false;
}
$("#busca").addEventListener("input", e => buscar(e.target.value));
$("#busca").addEventListener("keydown", e => {
  const itens = [...$("#resultados").querySelectorAll("a")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    selecionado = (selecionado + (e.key === "ArrowDown" ? 1 : -1) + itens.length) % itens.length;
    itens.forEach((a, k) => a.classList.toggle("sel", k === selecionado));
  } else if (e.key === "Enter" && itens.length) {
    location.hash = itens[Math.max(0, selecionado)].getAttribute("href");
    fecharBusca();
  } else if (e.key === "Escape") fecharBusca();
});
function fecharBusca() { $("#resultados").hidden = true; $("#busca").value = ""; $("#busca").blur(); }
document.addEventListener("click", e => { if (!e.target.closest(".busca")) $("#resultados").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#busca").focus(); } });

/* a curva */
let fi = 0, vi = 0;
function iniciarCurva() {
  const C = DADOS.curva;
  fi = Math.max(0, C.fracoes.findIndex(f => Math.abs(f - 0.28) < 1e-6));
  vi = Math.max(0, C.volumes.indexOf(4000));
  $("#c-fracao").value = fi; $("#c-volume").value = vi;
  $("#c-fracao").addEventListener("input", e => { fi = +e.target.value; desenharCurva(); });
  $("#c-volume").addEventListener("input", e => { vi = +e.target.value; desenharCurva(); });
  desenharCurva();
  const svg = $("#grafico"), dica = $("#dica");
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 640;
    const k = Math.round((x - 56) / (640 - 56 - 16) * (C.volumes.length - 1));
    if (k < 0 || k >= C.volumes.length) { dica.hidden = true; return; }
    const linha = C.grade[C.fracoes[fi].toFixed(2)][k];
    dica.innerHTML = `${fmt(C.volumes[k])} L · <b>${fmt(linha[0], 2)}%</b>`;
    dica.hidden = false;
    dica.style.left = (e.pageX + 14) + "px"; dica.style.top = (e.pageY - 34) + "px";
    const g = $("#guia");
    if (g) { const px = 56 + k / (C.volumes.length - 1) * (640 - 72); g.setAttribute("x1", px); g.setAttribute("x2", px); g.style.display = ""; }
  });
  svg.addEventListener("pointerleave", () => { dica.hidden = true; const g = $("#guia"); if (g) g.style.display = "none"; });
  svg.addEventListener("click", e => {
    const r = svg.getBoundingClientRect();
    const k = Math.round(((e.clientX - r.left) / r.width * 640 - 56) / (640 - 72) * (C.volumes.length - 1));
    if (k >= 0 && k < C.volumes.length) { vi = k; $("#c-volume").value = k; desenharCurva(); }
  });
}
function desenharCurva() {
  const svg = $("#grafico");
  if (!svg) return;
  const C = DADOS.curva, f = C.fracoes[fi], linhas = C.grade[f.toFixed(2)];
  const W = 640, H = 320, E = 56, D = 16, T = 18, B = 42;
  const ymax = 60, xmax = C.volumes[C.volumes.length - 1];
  const X = v => E + v / xmax * (W - E - D), Y = p => T + (1 - p / ymax) * (H - T - B);
  let s = "";
  for (let p = 0; p <= ymax; p += 10) s += `<line class="grade" x1="${E}" x2="${W - D}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${E - 8}" y="${Y(p) + 4}" text-anchor="end">${p}%</text>`;
  for (let v = 0; v <= xmax; v += 5000) s += `<text x="${X(v)}" y="${H - B + 18}" text-anchor="middle">${fmt(v / 1000)} m³</text>`;
  s += `<text x="${(E + W - D) / 2}" y="${H - 6}" text-anchor="middle">volume da cisterna</text>`;
  s += `<line class="eixo" x1="${E}" x2="${W - D}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  const teto = f * 100;
  s += `<line class="teto" x1="${E}" x2="${W - D}" y1="${Y(teto)}" y2="${Y(teto)}"/><text x="${W - D}" y="${Y(teto) - 6}" text-anchor="end">teto: fração atendível de ${fmt(teto)}%</text>`;
  const pts = linhas.map((l, k) => `${X(C.volumes[k])},${Y(l[0])}`).join(" ");
  s += `<polygon class="area" points="${X(0)},${Y(0)} ${pts} ${X(xmax)},${Y(0)}"/>`;
  s += `<polyline class="serie" points="${pts}"/>`;
  s += `<line id="guia" class="guia" x1="0" x2="0" y1="${T}" y2="${Y(0)}" style="display:none"/>`;
  const atual = linhas[vi];
  s += `<circle class="ponto" cx="${X(C.volumes[vi])}" cy="${Y(atual[0])}" r="6"/>`;
  svg.innerHTML = s;
  const ganho = vi > 0 ? (atual[0] - linhas[vi - 1][0]) / ((C.volumes[vi] - C.volumes[vi - 1]) / 1000) : null;
  $("#o-fracao").textContent = fmt(teto) + "%";
  $("#o-volume").textContent = fmt(C.volumes[vi]) + " L";
  $("#l-pot").textContent = fmt(atual[0], 2) + "%";
  $("#l-teto").textContent = "de " + fmt(teto) + "%";
  $("#l-dias").textContent = fmt(atual[1], 1) + "%";
  $("#l-extra").textContent = fmt(atual[2]);
  $("#l-ganho").textContent = ganho === null ? "—" : fmt(ganho, 2);
}

/* página de seção */
function secao(id, ancora) {
  const s = POR_ID[id];
  if (!s) { location.hash = "#/"; return; }
  const cap = s.cap, cor = corDe(cap);
  const idx = SECOES.indexOf(s), ant = SECOES[idx - 1], prox = SECOES[idx + 1];
  const vol = DADOS.volumes.find(v => v.capitulo === cap.n);
  const lateral = DADOS.capitulos.map(c => `<div class="cap" style="--c:${corDe(c)}"><button type="button" aria-expanded="${c === cap}"><i></i>${c.apendice ? "" : c.n + " · "}${esc(c.titulo)}</button><ul${c === cap ? "" : " hidden"}>${c.secoes.map(x => `<li><a href="#/${x.id}" class="${x === s ? "ativo" : ""}">${esc(x.rotulo)} ${esc(x.titulo)}</a></li>`).join("")}</ul></div>`).join("");
  const nesta = s.toc.length ? `<nav class="nesta" aria-label="Nesta página"><b>Nesta página</b><ol>${s.toc.map(t => `<li><a href="#/${id}/${t.id}">${esc(t.titulo)}</a></li>`).join("")}</ol></nav>` : "";
  const tabelas = s.html.replace(/<table>/g, '<div class="tabela"><table>').replace(/<\/table>/g, "</table></div>");
  $("#app").innerHTML = `<div class="doc" style="--c:${cor}">
    <aside class="lateral" aria-label="Sumário">${lateral}</aside>
    <article class="conteudo">
      <div class="trilha"><a href="#/">Documentação</a> / ${esc(cap.apendice ? cap.titulo : cap.n + ". " + cap.titulo)}</div>
      <h1><span class="num">${esc(s.rotulo)}</span>${esc(s.titulo)}</h1>
      <div class="chips">${vol ? `<span class="chip vol">Volume ${esc(vol.titulo)}</span>` : ""}<span class="chip">Netuno 5.0.0</span><span class="chip">Revisão de ${DADOS.revisao}</span></div>
      ${nesta}
      <div class="texto">${tabelas}</div>
      <div class="passos">${ant ? `<a href="#/${ant.id}"><small>Anterior</small>${esc(ant.rotulo)} ${esc(ant.titulo)}</a>` : ""}${prox ? `<a class="prox" href="#/${prox.id}"><small>Próxima</small>${esc(prox.rotulo)} ${esc(prox.titulo)}</a>` : ""}</div>
    </article>
  </div>${rodape()}`;
  document.querySelectorAll(".lateral .cap > button").forEach(b => b.addEventListener("click", () => {
    const ul = b.nextElementSibling; ul.hidden = !ul.hidden; b.setAttribute("aria-expanded", String(!ul.hidden));
  }));
  document.title = `${s.rotulo} ${s.titulo} · Netuno`;
  if (ancora) {
    const alvo = document.getElementById(ancora);
    if (alvo) { alvo.scrollIntoView({block: "start"}); window.scrollBy(0, -70); alvo.classList.add("alvo"); return; }
  }
  window.scrollTo(0, 0);
  const lat = $(".lateral a.ativo");
  if (lat) lat.scrollIntoView({block: "center"});
}

/* rotas */
function rota() {
  const h = location.hash.replace(/^#\/?/, "");
  const [id, ancora] = h.split("/");
  document.querySelectorAll("#nav a").forEach(a => {
    const alvo = a.dataset.h.replace("#/", "");
    const s = POR_ID[id];
    a.classList.toggle("ativo", alvo === "" ? !id : !!(s && POR_ID[alvo] && POR_ID[alvo].cap === s.cap));
  });
  if (!id) { document.title = "Documentação do Netuno"; inicio(); window.scrollTo(0, 0); return; }
  secao(decodeURIComponent(id), ancora);
}
window.addEventListener("hashchange", rota);
rota();
