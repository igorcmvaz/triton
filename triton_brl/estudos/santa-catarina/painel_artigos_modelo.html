<!doctype html>

<!-- Modelo do painel; gerado por scripts/gerar_graficos_artigos.py (substitui /*__DADOS__*/null).
     Sem dependências de rede: SVG desenhado em JavaScript puro. -->
<style>
:root{color-scheme:light;--bg:#f9f9f7;--surf:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a65;
--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--neutral:#9a9992;--neutral2:#e8e7e1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#0d0d0d;--surf:#1a1a19;
--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--neutral:#898781;--neutral2:#2c2c2a;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0d;--surf:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--neutral:#898781;--neutral2:#2c2c2a;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:18px}
h1{font-size:20px;margin:0}
.ctl{display:flex;gap:8px}
button{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--axis);border-radius:8px;padding:5px 12px;cursor:pointer}
button[aria-pressed="true"],button[aria-selected="true"]{border-color:var(--ink);font-weight:600}
button:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
nav button .dot{display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid var(--ink);vertical-align:-1px}
.card{background:var(--surf);border:1px solid var(--ring);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 4px}
.sub{color:var(--ink2);font-size:12.5px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink2);font-size:11px;font-family:inherit}
svg .t{fill:var(--ink);font-weight:600;font-size:12px}
svg .g{stroke:var(--grid);stroke-width:1}
svg .a{stroke:var(--axis);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-top:6px}
.leg svg{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;border-bottom:1px solid var(--grid);text-align:right}
th:first-child,td:first-child{text-align:left}
details{margin-top:8px}summary{cursor:pointer;color:var(--ink2)}
.dl a{color:var(--ink);margin-right:10px}
footer{color:var(--muted);font-size:12px;padding:6px 0 28px}
</style>
</head>
<body>
<header>
<h1 id="h1"></h1>
<div class="ctl"><button id="bl" type="button"></button><button id="bt" type="button"></button></div>
</header>
<main>
<nav id="nav" role="tablist"></nav>
<section id="vista"></section>
<footer id="rodape"></footer>
</main>
<script>

const LS={pt:"pt-BR",en:"en-GB"};
let lang="pt-BR",tema=0,aba="resumo";
try{lang=localStorage.getItem("sc_lang")||lang;tema=+localStorage.getItem("sc_tema")||0}catch(e){}
if(!I[lang])lang="pt-BR";
const T=()=>I[lang];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function num(x,d){let s=Math.abs(x).toFixed(d);let[p,q]=s.split(".");p=p.replace(/\B(?=(\d{3})+(?!\d))/g,T().mil);
return(x<0?"−":"")+p+(q?T().dec+q:"")}
function nauto(x){return Math.abs(x-Math.round(x))<1e-9?num(Math.round(x),0):num(x,Math.abs(+x.toFixed(1)-x)<1e-9?1:2)}
function el(t,a,p,tx){const e=document.createElementNS(NS,t);for(const k in a||{})e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;if(p)p.appendChild(e);return e}
function h(t,a,p,tx){const e=document.createElement(t);for(const k in a||{})e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;if(p)p.appendChild(e);return e}
const cor=t=>`var(--s${t.slot+1})`;
function marca(p,m,x,y,r,fill,tt){const a={fill:fill,stroke:"var(--ink)","stroke-width":.8};let e;
if(m==="o")e=el("circle",{cx:x,cy:y,r:r,...a},p);
else if(m==="s")e=el("rect",{x:x-r,y:y-r,width:2*r,height:2*r,...a},p);
else if(m==="D")e=el("polygon",{points:`${x},${y-r*1.3} ${x+r*1.3},${y} ${x},${y+r*1.3} ${x-r*1.3},${y}`,...a},p);
else if(m==="^")e=el("polygon",{points:`${x},${y-r*1.25} ${x+r*1.2},${y+r} ${x-r*1.2},${y+r}`,...a},p);
else if(m==="v")e=el("polygon",{points:`${x},${y+r*1.25} ${x+r*1.2},${y-r} ${x-r*1.2},${y-r}`,...a},p);
else{e=el("path",{d:`M${x-r*1.2} ${y}H${x+r*1.2}M${x} ${y-r*1.2}V${y+r*1.2}`,stroke:"var(--ink)","stroke-width":3.2,fill:"none"},p);}
if(tt)el("title",{},e,tt);return e}
function ticks(lo,hi,n){const span=hi-lo||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));
const st=[1,2,2.5,5,10].map(k=>k*mag).find(s=>s>=raw)||mag*10;const out=[];
for(let v=Math.ceil(lo/st-1e-9)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(10));return out}
function escala(vals,tipo){const m=Math.max(...vals.map(Math.abs));
if(tipo==="moeda"){const d=m>=1e6?1e6:(m>=1e4?1e3:1);return[d,T().moeda[d]]}
const d=m>=1e4?1e3:1;return[d,T().massa[d]]}
// quadro base: devolve {svg, gx(v), gy(i)}
const W=420;
function quadro(host,H,L,R,Tp,B){const s=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"},host);return{s,L,R:W-R,T:Tp,B:H-B}}
function eixoX(q,lo,hi,fx,lab,tk,fmt){tk=tk||ticks(lo,hi,5);fmt=fmt||nauto;
el("line",{x1:q.L,x2:q.R,y1:q.B,y2:q.B,class:"a"},q.s);
tk.forEach(v=>{const x=fx(v);el("line",{x1:x,x2:x,y1:q.T,y2:q.B,class:"g"},q.s);el("text",{x:x,y:q.B+13,"text-anchor":"middle"},q.s,fmt(v))});
el("text",{x:(q.L+q.R)/2,y:q.B+30,"text-anchor":"middle"},q.s,lab)}
function rotY(q,rows,fy){rows.forEach((r,i)=>{r.split("\n").forEach((ln,j,a)=>el("text",{x:q.L-6,y:fy(i)+4+(j-(a.length-1)/2)*12,"text-anchor":"end"},q.s,ln))})}
function titulo(q,t){el("text",{x:2,y:12,class:"t"},q.s,t)}

function pVolumes(host,tips,detalhe){const rows=detalhe?Object.keys(T().crit).map(k=>({lab:T().crit[k],k})):tips.map(t=>({lab:t.nome[lang].replace(" ","\n"),t}));
const n=rows.length,H=detalhe?210:300,q=quadro(host,H,detalhe?92:98,16,22,38);
const fy=i=>q.T+(i+.5)*(q.B-q.T)/n;
let lo=0,hi=0;rows.forEach(r=>{(detalhe?[r.k]:["smaa"]).forEach(k=>hi=Math.max(hi,(detalhe?tips[0]:r.t).vol[k][2]))});hi*=1.08;
const sym=!detalhe;const f=v=>sym?(v<1?v:1+Math.log10(v)):v;
const x0=q.L+6,sc=(q.R-q.L-6)/(f(hi)-f(0));const X=v=>x0+(f(v)-f(0))*sc;
const tk=sym?[0,1,10,100,1000].filter(v=>v<=hi*1.01):ticks(0,hi,5);
eixoX(q,0,hi,X,T().volx+(sym?" – "+(lang==="pt-BR"?"simétrica-log":"symlog"):""),tk);
titulo(q,(detalhe?"(a) "+T().av:"(a) "+T().a));rotY(q,rows.map(r=>r.lab),fy);
rows.forEach((r,i)=>{const t=detalhe?tips[0]:r.t;const c=cor(t);const ks=detalhe?[r.k]:["tec","eco","amb","smaa"];
const sm=t.vol.smaa;
if(!detalhe)el("line",{x1:X(sm[1]),x2:X(sm[2]),y1:fy(i),y2:fy(i),stroke:c,"stroke-width":4,"stroke-linecap":"round"},q.s);
ks.forEach(k=>{const v=t.vol[k];if(detalhe)el("line",{x1:X(v[1]),x2:X(v[2]),y1:fy(i),y2:fy(i),stroke:c,"stroke-width":k==="smaa"?4:2.5,"stroke-linecap":"round"},q.s);
const mk={tec:"^",eco:"s",amb:"D",top:"P",smaa:"o"}[k];
marca(q.s,mk,X(v[0]),fy(i),k==="smaa"?6:4.2,c,`${(detalhe?T().crit[k]:t.nome[lang]+" – "+T().crit[k])}: ${nauto(v[0])} m³ (P10–P90: ${nauto(v[1])}–${nauto(v[2])})`)})})}
function pViab(host,tips){const n=tips.length,q=quadro(host,300,98,50,22,38),fy=i=>q.T+(i+.5)*(q.B-q.T)/n,X=v=>q.L+v/100*(q.R-q.L);
eixoX(q,0,100,X,T().posx,[0,25,50,75,100]);titulo(q,"(b) "+T().b);rotY(q,tips.map(t=>t.nome[lang].replace(" ","\n")),fy);
const bh=(q.B-q.T)/n*.62;
tips.forEach((t,i)=>{const s=t.share,y=fy(i)-bh/2,c=cor(t);
const seg=(a,b,fill,cls,tt)=>{if(b<=0)return;const r=el("rect",{x:X(a),y:y,width:X(a+b)-X(a),height:bh,fill:fill,stroke:"var(--ink)","stroke-width":.7},q.s);if(cls)r.setAttribute("fill",cls);el("title",{},r,tt)};
seg(0,s.pos,c,null,`${t.nome[lang]}: ${T().pos} ${num(s.pos,1)} %`);
seg(s.pos,s.zero,"url(#pt)",null,`${t.nome[lang]}: ${T().zero} ${num(s.zero,1)} %`);
seg(s.pos+s.zero,s.neg,"url(#hz)",null,`${t.nome[lang]}: ${T().neg} ${num(s.neg,1)} %`);
el("text",{x:q.R+5,y:fy(i)+4,style:"font-weight:700;fill:var(--ink)"},q.s,num(s.pos,0)+" %")});
const d=el("defs",{},q.s);
const p1=el("pattern",{id:"pt",width:5,height:5,patternUnits:"userSpaceOnUse"},d);el("rect",{width:5,height:5,fill:"var(--neutral2)"},p1);el("circle",{cx:2.5,cy:2.5,r:.8,fill:"var(--ink2)"},p1);
const p2=el("pattern",{id:"hz",width:6,height:6,patternUnits:"userSpaceOnUse",patternTransform:"rotate(45)"},d);el("rect",{width:6,height:6,fill:"var(--surf)"},p2);el("line",{x1:0,y1:0,x2:0,y2:6,stroke:"var(--ink)","stroke-width":1.3},p2)}
function pPay(host,tips){const n=tips.length,q=quadro(host,300,98,16,22,38),fy=i=>q.T+(i+.5)*(q.B-q.T)/n;
const hi=Math.max(...tips.map(t=>t.pay[2]))*1.06,X=v=>q.L+6+v/hi*(q.R-q.L-6);
eixoX(q,0,hi,X,T().payx);titulo(q,"(c) "+T().c);rotY(q,tips.map(t=>t.nome[lang].replace(" ","\n")),fy);
tips.forEach((t,i)=>{const c=cor(t);el("line",{x1:X(t.pay[1]),x2:X(t.pay[2]),y1:fy(i),y2:fy(i),stroke:c,"stroke-width":4,"stroke-linecap":"round"},q.s);
marca(q.s,t.marcador,X(t.pay[0]),fy(i),6,c,`${t.nome[lang]}: ${nauto(t.pay[0])} (P10–P90: ${nauto(t.pay[1])}–${nauto(t.pay[2])}); n = ${t.pay[3]}`)})}
const RECS=[["hist-1981-2010",0,"HIST"],["ssp245-2021-2050",1,"A"],["ssp245-2041-2070",2,"A"],["ssp245-2071-2100",3,"A"],["ssp585-2021-2050",1,"B"],["ssp585-2041-2070",2,"B"],["ssp585-2071-2100",3,"B"]];
function pRec(host,t,met,tipo,ylab,letra,tit){const vals=[];Object.values(t.rec).forEach(r=>vals.push(...r[met]));
let div=1,un="";if(tipo){[div,un]=escala(vals,tipo)}
const q=quadro(host,230,56,14,22,50);let lo=Math.min(...vals)/div,hi=Math.max(...vals)/div;
if(tipo&&lo>0)lo=0;if(tipo&&hi<0)hi=0;const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
const tk=ticks(lo,hi,5),Y=v=>q.B-(v-lo)/(hi-lo)*(q.B-q.T),X=x=>q.L+(x+.45)/3.9*(q.R-q.L);
el("line",{x1:q.L,x2:q.R,y1:q.B,y2:q.B,class:"a"},q.s);
tk.forEach(v=>{el("line",{x1:q.L,x2:q.R,y1:Y(v),y2:Y(v),class:"g"},q.s);el("text",{x:q.L-5,y:Y(v)+4,"text-anchor":"end"},q.s,nauto(v))});
if(lo<0&&hi>0)el("line",{x1:q.L,x2:q.R,y1:Y(0),y2:Y(0),stroke:"var(--ink2)","stroke-width":1.2},q.s);
const xl=["1981–2010","2021–2050","2041–2070","2071–2100"];
xl.forEach((s,i)=>{el("text",{x:X(i),y:q.B+13,"text-anchor":"middle"},q.s,s);el("text",{x:X(i),y:q.B+25,"text-anchor":"middle"},q.s,T().rec[i])});
el("text",{x:(q.L+q.R)/2,y:q.B+42,"text-anchor":"middle"},q.s,T().recx);
const yl=el("text",{transform:`translate(11 ${(q.T+q.B)/2}) rotate(-90)`,"text-anchor":"middle"},q.s,tipo?ylab+" ("+un+")":ylab);
titulo(q,`(${letra}) `+tit);
const c=cor(t),off={A:-.09,B:.09,HIST:0};
["A","B"].forEach(cn=>{const pts=[[0,t.rec["hist-1981-2010"][met][0]/div]].concat(RECS.filter(r=>r[2]===cn).map(r=>[r[1]+off[cn],t.rec[r[0]][met][0]/div]));
el("polyline",{points:pts.map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:"none",stroke:c,"stroke-width":1.8,"stroke-dasharray":cn==="B"?"6 3":"none"},q.s)});
RECS.forEach(r=>{const v=t.rec[r[0]][met].map(z=>z/div),x=X(r[1]+off[r[2]]);
el("line",{x1:x,x2:x,y1:Y(v[1]),y2:Y(v[2]),stroke:c,"stroke-width":2},q.s);
const lab=r[2]==="HIST"?T().rec[0]:(r[2]==="A"?T().s245:T().s585)+" "+xl[r[1]];
marca(q.s,r[2]==="B"?"s":"o",x,Y(v[0]),4.6,r[2]==="B"?"var(--surf)":c,`${lab}: ${nauto(+v[0].toFixed(3))} (P10–P90: ${nauto(+v[1].toFixed(3))}–${nauto(+v[2].toFixed(3))})${tipo?" "+un:""}`)})}
function legenda(host,itens){const d=h("div",{class:"leg"},host);itens.forEach(([svgfn,tx])=>{const s=h("span",{},d);const v=el("svg",{viewBox:"0 0 14 14"},null);svgfn(v);s.appendChild(v);s.appendChild(document.createTextNode(tx))})}
function carta(p,tit,sub){const c=h("div",{class:"card"},p);if(tit)h("h2",{},c,tit);if(sub)h("p",{class:"sub"},c,sub);return c}
function tabela(host,cab,linhas){const dt=h("details",{},host),s=h("summary",{},dt,T().tabela),t=h("table",{},dt),th=h("tr",{},h("thead",{},t));
cab.forEach(c=>h("th",{},th,c));const tb=h("tbody",{},t);linhas.forEach(l=>{const tr=h("tr",{},tb);l.forEach(c=>h("td",{},tr,c))})}
function baixar(host,nome){const base=`figuras_artigos/${lang}`;const d=h("p",{class:"dl sub"},host,T().dl+": ");
["dupla","simples"].forEach(c=>D.formatos.forEach(f=>{const a=h("a",{href:`${base}/${c}/fig_${nome}.${f}`,download:""},d,`${c} .${f}`)}))}
function vistaResumo(){const v=document.getElementById("vista");v.innerHTML="";const tips=D.tipologias;
const c=carta(v,T().resumo,T().hist+"; n = "+[...new Set(tips.map(t=>t.n_hist))].join(" / ")+" "+T().n);
const g=h("div",{class:"grid"},c);pVolumes(h("div",{},g),tips,false);pViab(h("div",{},g),tips);pPay(h("div",{},g),tips);
legenda(c,[[s=>marca(s,"^",7,8,3.6,"var(--neutral)"),T().crit.tec],[s=>marca(s,"s",7,7,3.6,"var(--neutral)"),T().crit.eco],[s=>marca(s,"D",7,7,3.4,"var(--neutral)"),T().crit.amb],[s=>marca(s,"o",7,7,5,"var(--neutral)"),T().crit.smaa+" (P10–P90)"],[s=>el("rect",{x:1,y:3,width:12,height:8,fill:"var(--neutral)",stroke:"var(--ink)"},s),T().pos],[s=>el("rect",{x:1,y:3,width:12,height:8,fill:"url(#pt)",stroke:"var(--ink)"},s),T().zero],[s=>el("rect",{x:1,y:3,width:12,height:8,fill:"url(#hz)",stroke:"var(--ink)"},s),T().neg]]);
tabela(c,[T().colr[0],T().crit.smaa+" (m³)",T().pos+" (%)",T().zero+" (%)",T().neg+" (%)",T().payx+" – "+T().colr[1]],
tips.map(t=>[t.nome[lang],num(t.vol.smaa[0],1),num(t.share.pos,1),num(t.share.zero,1),num(t.share.neg,1),num(t.pay[0],1)]));
baixar(c,"resumo")}
function vistaTipo(t){const v=document.getElementById("vista");v.innerHTML="";
const c=carta(v,t.nome[lang],`${t.n_locais} ${T().locais} × 19 × 7 = ${t.n_casos} ${T().n}; ${T().hist}: n = ${t.n_hist}`);
const g=h("div",{class:"grid"},c);pVolumes(h("div",{},g),[t],true);
pRec(h("div",{},g),t,"economia_agua_potavel_pct",null,T().agua,"b",T().agua.replace(" (%)",""));
pRec(h("div",{},g),t,"vpl","moeda",T().vpl,"c",T().vpl.replace("VPL em 20 anos","Valor presente líquido"));
pRec(h("div",{},g),t,"co2_liquido_vida_kg","massa",T().co2,"d",T().co2);
legenda(c,[[s=>{el("line",{x1:0,x2:14,y1:7,y2:7,stroke:cor(t),"stroke-width":2},s);marca(s,"o",7,7,3.4,cor(t))},T().s245],[s=>{el("line",{x1:0,x2:14,y1:7,y2:7,stroke:cor(t),"stroke-width":2,"stroke-dasharray":"4 2"},s);marca(s,"s",7,7,3.4,"var(--surf)")},T().s585],[s=>el("line",{x1:7,x2:7,y1:1,y2:13,stroke:cor(t),"stroke-width":2},s),T().ic]]);
const L=[];Object.keys(t.rec).forEach(r=>{const x=t.rec[r];L.push([r,num(x.vpl[0],0),num(x.vpl[1],0),num(x.vpl[2],0)])});
tabela(c,[T().colr[0],T().vpl+" – "+T().colr[1]+" (R$)",T().colr[2],T().colr[3]],L);
baixar(c,t.chave)}
function render(){document.documentElement.lang=lang;document.title=T().titulo;
document.getElementById("h1").textContent=T().titulo;document.getElementById("bl").textContent=T().lang;
document.getElementById("bt").textContent=T().tema[tema];document.getElementById("rodape").textContent=T().rod;
const nav=document.getElementById("nav");nav.innerHTML="";
const mk=(id,tx,sl)=>{const b=h("button",{type:"button",role:"tab","aria-selected":aba===id?"true":"false"},nav);
if(sl!=null)h("span",{class:"dot",style:`background:var(--s${sl+1})`},b);b.appendChild(document.createTextNode(tx));b.onclick=()=>{aba=id;render()}};
mk("resumo",T().resumo,null);D.tipologias.forEach(t=>mk(t.chave,t.nome[lang],t.slot));
if(aba==="resumo")vistaResumo();else vistaTipo(D.tipologias.find(t=>t.chave===aba))}
function aplicaTema(){const r=document.documentElement;if(tema===0)r.removeAttribute("data-theme");else r.setAttribute("data-theme",tema===1?"light":"dark")}
document.getElementById("bl").onclick=()=>{lang=lang==="pt-BR"?"en-GB":"pt-BR";try{localStorage.setItem("sc_lang",lang)}catch(e){}render()};
document.getElementById("bt").onclick=()=>{tema=(tema+1)%3;try{localStorage.setItem("sc_tema",tema)}catch(e){}aplicaTema();render()};
aplicaTema();render();
</script>
</body>
</html>
