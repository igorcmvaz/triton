<style>

  --r1: #0d3b66; --r2: #17598f; --r3: #2b7ab5; --r4: #5b9dd2; --r5: #8dbde4; --r6: #b9d6ee; --r7: #dcebf8;

    --accent-soft: #15304b; --mark: #5b4b12; --series: #4f9bd8; --grid: #1c2d42;
    --s1: #4f9bd8; --s2: #db7438; --s3: #9670d2; --s4: #2fa37f; --on-accent: #061327;

}
:root[data-theme="dark"] {
  --bg: #0b1522; --surface: #101c2c; --ink: #e5ecf3; --ink2: #a6b5c5; --ink3: #8595a7;
  --line: #22344a; --navy: #061327; --navy-ink: #e8f0f8; --accent: #4f9bd8; --link: #7bb7ea;
  --accent-soft: #15304b; --mark: #5b4b12; --series: #4f9bd8; --grid: #1c2d42;
    --s1: #4f9bd8; --s2: #db7438; --s3: #9670d2; --s4: #2fa37f; --on-accent: #061327;
    --r1: #9fcaf0; --r2: #7fb4e4; --r3: #5f9cd6; --r4: #4581bd; --r5: #33669b; --r6: #244c76; --r7: #1a3a5c;

  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
img { max-width: 100%; }
table { font-size: inherit; }

/* barra superior */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topo-in { display: flex; align-items: center; gap: 18px; max-width: 1320px; margin: 0 auto; padding: 10px 20px; }
.marca { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; min-width: 0; }
.marca img { width: 32px; height: 32px; }
.marca b { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
.marca small { display: block; color: var(--ink3); font-size: 11.5px; line-height: 1.2; }
.nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: nowrap; white-space: nowrap; }
@media (max-width: 1240px) { .marca small { display: none; } }
@media (max-width: 1080px) { .nav a { padding: 6px 7px; font-size: 13px; } }
.nav a { color: var(--ink2); text-decoration: none; font-size: 13.5px; padding: 6px 10px; border-radius: 6px; }
.nav a:hover { background: var(--accent-soft); color: var(--ink); }
.nav a.ativo { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.busca { position: relative; }
.busca input { width: 230px; font: inherit; font-size: 13.5px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
.resultados { position: absolute; right: 0; top: calc(100% + 6px); width: min(460px, 92vw); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; }
.resultados a { display: block; padding: 8px 10px; border-radius: 7px; color: var(--ink); text-decoration: none; }
.resultados a:hover, .resultados a.sel { background: var(--accent-soft); }
.resultados b { display: block; font-size: 13.5px; }
.resultados span { display: block; color: var(--ink2); font-size: 12.5px; font-family: var(--serif); }
.resultados mark { background: var(--mark); color: inherit; }
.resultados .vazio { padding: 10px; color: var(--ink2); font-size: 13px; line-height: 1.45; }
.resultados .dica-busca { padding: 8px 10px 6px; color: var(--ink3); font-size: 12.5px; line-height: 1.4; }
.resultados .sugestao { all: unset; cursor: pointer; display: block; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; color: var(--link); }
.resultados .sugestao:hover { background: var(--accent-soft); }
.selo { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-right: 7px; vertical-align: 1px; background: var(--accent-soft); color: var(--accent); }
.selo.t-figura, .selo.t-tabela { background: var(--grid); color: var(--ink2); }
.selo.t-interativa { background: var(--s4); color: #fff; }
.selo.t-sub { background: transparent; color: var(--ink3); padding-left: 0; }
.tema { background: none; border: 1px solid var(--line); color: var(--ink2); border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 13px; cursor: pointer; }
.selo-versao { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; text-decoration: none; white-space: nowrap; }
.selo-versao:hover { background: var(--accent); color: var(--on-accent); }
@media (max-width: 900px) { .selo-versao { display: none; } }
.doc.so-texto { grid-template-columns: minmax(0, 1fr); max-width: 1000px; }
.versoes { max-width: 900px; }
.versao { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; }
.versao-topo { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 14px; }
.versao-topo h3 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.versao-topo .data { color: var(--ink3); font-size: 13.5px; }
.versao-topo .atual { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--s4); border: 1px solid var(--s4); border-radius: 999px; padding: 1px 8px; }
.versao .resumo { font-family: var(--serif); font-size: 17px; line-height: 1.55; margin: 0 0 14px; }
.versao .contagem { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 16px; }
.versao .contagem span { font-size: 12.5px; color: var(--ink2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
.versao .contagem span b { color: var(--ink); font-variant-numeric: tabular-nums; }
.versao details { border-top: 1px solid var(--line); padding: 10px 0 2px; }
.versao details summary { cursor: pointer; font-weight: 600; font-size: 14.5px; padding: 2px 0; }
.versao details[open] summary { margin-bottom: 8px; }
.versao details .corpo { font-family: var(--serif); font-size: 16px; line-height: 1.6; }
.versao details .corpo table { border-collapse: collapse; font-family: var(--sans); font-size: 13.5px; width: 100%; margin: 8px 0; }
.versao details .corpo th { text-align: left; background: var(--accent-soft); font-weight: 600; }
.versao details .corpo th, .versao details .corpo td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.versao details .corpo p { margin: 0 0 10px; }
.versao details .corpo blockquote { margin: 10px 0; padding: 8px 14px; border-left: 3px solid var(--nota-line); background: var(--bg); border-radius: 0 8px 8px 0; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 13px; }

/* página inicial */
.hero { background: var(--navy); color: var(--navy-ink); position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: url("img/capa_completo.jpg") center 42% / cover no-repeat; opacity: 0.55; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--navy) 0%, rgba(11,37,69,0.88) 38%, rgba(11,37,69,0.35) 75%, rgba(11,37,69,0.15) 100%); }
.hero-in { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 56px 20px 60px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8ecae6; margin: 0 0 12px; }
.hero h1 { font-size: clamp(30px, 4.2vw, 48px); line-height: 1.08; margin: 0 0 16px; font-weight: 700; text-wrap: balance; letter-spacing: -0.01em; }
.hero p.lead { font-family: var(--serif); font-size: 18px; max-width: 58ch; color: #d6e3ef; margin: 0 0 24px; }
.botoes { display: flex; flex-wrap: wrap; gap: 10px; }
.botao { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid rgba(255,255,255,0.35); color: #fff; }
.botao.cheio { background: #fff; color: #0b2545; border-color: #fff; }
.botao:hover { border-color: #fff; }
.fatos { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; overflow: hidden; backdrop-filter: blur(3px); }
.fatos div { background: rgba(6, 19, 39, 0.72); padding: 14px 16px; }
.fatos small { display: block; color: #9fb6cc; font-size: 11.5px; letter-spacing: 0.04em; }
.fatos b { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; color: #fff; }
.faixa { max-width: 1320px; margin: 0 auto; padding: 44px 20px 8px; }
.faixa > h2 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.005em; }
.faixa > p.sub { color: var(--ink2); margin: 0 0 20px; font-family: var(--serif); font-size: 16px; max-width: 70ch; }
.volumes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1180px) { .volumes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .volumes { grid-template-columns: 1fr; } }
.volume { display: grid; grid-template-rows: 118px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--ink); transition: transform 0.15s, box-shadow 0.15s; }
.volume:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.volume .painel { background: #0b2545 center / cover no-repeat; position: relative; }
.volume .painel b { position: absolute; left: 14px; bottom: 6px; font-size: 44px; line-height: 1; font-weight: 700; }
.volume .txt { padding: 14px 16px 16px; border-top: 3px solid var(--c); }
.volume h3 { margin: 0 0 4px; font-size: 16px; }
.volume p { margin: 0; color: var(--ink2); font-family: var(--serif); font-size: 14.5px; }

.curva { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.curva svg { width: 100%; height: auto; display: block; }
.curva svg text { fill: var(--ink2); font-family: var(--sans); font-size: 11px; }
.curva .eixo { stroke: var(--line); }
.curva .grade { stroke: var(--grid); }
.curva .serie { fill: none; stroke: var(--series); stroke-width: 2; }
.curva .area { fill: var(--series); opacity: 0.08; }
.curva .teto { stroke: var(--ink3); stroke-dasharray: 4 4; }
.curva .ponto { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.curva .guia { stroke: var(--ink3); stroke-width: 1; }
.controles { display: grid; gap: 16px; align-content: start; }
.controle label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); margin-bottom: 4px; }
.controle label output { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.controle input[type=range] { width: 100%; accent-color: var(--accent); }
.leituras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.leitura { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.leitura small { display: block; color: var(--ink3); font-size: 11.5px; }
.leitura b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.leitura span { color: var(--ink2); font-size: 12px; }
.nota-curva { color: var(--ink2); font-size: 12.5px; font-family: var(--serif); margin: 0; }
.dica { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; }
.dica b { font-variant-numeric: tabular-nums; }

.fluxo { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; overflow-x: auto; }
.fluxo svg { min-width: 760px; width: 100%; height: auto; display: block; }
.fluxo .no rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.fluxo .no text { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 600; }
.fluxo .no text.sub { fill: var(--ink2); font-weight: 400; font-size: 11px; }
.fluxo .no:hover rect { fill: var(--surface); }
.fluxo .seta { stroke: var(--ink3); stroke-width: 1.4; fill: none; }
.fluxo .rotulo { fill: var(--ink3); font-family: var(--sans); font-size: 10.5px; }
.principios { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.principio { border-top: 2px solid var(--navy); padding-top: 12px; }
.principio h3 { margin: 0 0 6px; font-size: 15px; }
.principio p { margin: 0; color: var(--ink2); font-family: var(--serif); font-size: 15px; }
.pdfs { display: flex; flex-wrap: wrap; gap: 10px; }
.pdfs a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 13.5px; }
.pdfs a i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); display: inline-block; }
.rodape { max-width: 1320px; margin: 48px auto 0; padding: 24px 20px 40px; border-top: 1px solid var(--line); color: var(--ink3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

/* páginas de seção */
.doc { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 36px; padding: 0 20px; }
.lateral { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); align-self: start; max-height: calc(100vh - 70px); overflow: auto; padding: 22px 6px 30px 0; font-size: 13.5px; }
.lateral .cap { margin-bottom: 14px; }
.lateral .cap > button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); padding: 4px 0; width: 100%; }
.lateral .cap > button i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.lateral ul { list-style: none; margin: 4px 0 0; padding: 0; }
.lateral li a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--ink2); text-decoration: none; line-height: 1.35; }
.lateral li a:hover { background: var(--accent-soft); color: var(--ink); }
.lateral li a.ativo { background: var(--accent-soft); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--c); }
.conteudo { padding: 26px 0 60px; min-width: 0; }
.trilha { font-size: 12.5px; color: var(--ink3); margin-bottom: 10px; }
.trilha a { color: var(--ink3); }
.conteudo > h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.01em; text-wrap: balance; }
.conteudo > h1 .num { color: var(--c); margin-right: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); background: var(--surface); }
.chip.vol { border-color: var(--c); }
.nesta { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 16px; margin: 0 0 26px; }
.nesta b { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
.nesta ol { margin: 8px 0 0; padding-left: 18px; columns: 2; column-gap: 28px; font-size: 13.5px; }
.nesta li { break-inside: avoid; margin-bottom: 3px; }
.texto { font-family: var(--serif); font-size: 17px; line-height: 1.65; }
.texto > * { max-width: 74ch; }
.texto > figure.com-fi { max-width: 1060px; }
.texto p, .texto ul, .texto ol { margin: 0 0 14px; }
.texto h3 { font-family: var(--sans); font-size: 21px; margin: 34px 0 10px; line-height: 1.25; }
.texto h4 { font-family: var(--sans); font-size: 17px; margin: 26px 0 8px; }
.texto .ancora { margin-left: 8px; color: var(--ink3); text-decoration: none; opacity: 0; font-weight: 400; }
.texto h3:hover .ancora, .texto h4:hover .ancora { opacity: 1; }
.texto code { font-family: var(--mono); font-size: 0.84em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.texto pre { font-family: var(--mono); font-size: 13px; line-height: 1.5; background: var(--navy); color: #e3ecf5; padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
.texto pre code { background: none; padding: 0; color: inherit; }
.texto mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }
.texto blockquote { margin: 18px 0; padding: 10px 16px; border-left: 3px solid var(--nota-line); background: var(--surface); border-radius: 0 8px 8px 0; font-size: 16px; }
.texto blockquote p:last-child { margin-bottom: 0; }
.texto details.aprof { margin: 18px 0; border-left: 3px solid var(--aprof-line); background: var(--aprof); border-radius: 0 8px 8px 0; padding: 10px 16px; font-size: 16px; }
.texto details.aprof summary { cursor: pointer; font-family: var(--sans); font-weight: 600; font-size: 14.5px; }
.texto details.aprof[open] summary { margin-bottom: 8px; }
.texto .tabela { overflow-x: auto; margin: 6px 0 20px; max-width: 100%; }
.texto table { border-collapse: collapse; font-family: var(--sans); font-size: 13.5px; line-height: 1.4; min-width: 60%; }
.texto th { text-align: left; font-weight: 600; background: var(--accent-soft); }
.texto th, .texto td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.texto td { font-variant-numeric: tabular-nums; }
.texto .tab-cap { font-family: var(--sans); font-size: 13px; color: var(--ink2); margin: 20px 0 6px; }
.texto figure { margin: 22px 0; }
.texto figure.fig > a { display: block; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

<script>
const DADOS = /*__DADOS__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (v, d = 0) => Number(v).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d});
const CORES = {};
DADOS.volumes.forEach(v => { CORES[v.capitulo] = v.cor; });
const SECOES = [];
DADOS.capitulos.forEach(c => c.secoes.forEach(s => SECOES.push(Object.assign({cap: c}, s))));
const POR_ID = Object.fromEntries(SECOES.map(s => [s.id, s]));
const corDe = c => CORES[c.n] || "#4ea8de";

/* navegação principal */
const NAV = [["Início", "#/"], ["Comece aqui", "#/1.1"], ["Tutorial", "#/4.1"], ["Método", "#/2.1"], ["Guias", "#/3.1"], ["Apêndices", "#/A"]];
$("#nav").innerHTML = NAV.map(([t, h]) => `<a href="${h}" data-h="${h}">${t}</a>`).join("");

/* tema */
(function () {
  let salvo = null;
  try { salvo = localStorage.getItem("triton-tema"); } catch (e) {}
  if (salvo) document.documentElement.setAttribute("data-theme", salvo);
  $("#tema").addEventListener("click", () => {
    const atual = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const novo = atual === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", novo);
    try { localStorage.setItem("triton-tema", novo); } catch (e) {}
    if (location.hash === "" || location.hash === "#/") desenharCurva();
  });
})();

$("#menu-btn").addEventListener("click", () => { const l = $(".lateral"); if (l) l.classList.toggle("aberta"); });

/* busca: seções, subseções, figuras, tabelas e as figuras interativas */
const semAcento = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const TIPOS = {
  secao: ["seção", "t-secao"], sub: ["nesta seção", "t-sub"], figura: ["figura", "t-figura"],
  interativa: ["figura interativa", "t-interativa"], tabela: ["tabela", "t-tabela"],
};
const INDICE = (DADOS.busca || []).map(i => {
  // Só a seção tem texto corrido, e ele é o da própria seção, sem cópia.
  const x = i.t === "secao" ? ((POR_ID[i.id] || {}).texto || "") : "";
  return Object.assign({}, i, {x, nn: semAcento((i.r + " " + i.n).toLowerCase()),
                               xn: semAcento(x.toLowerCase())});
});
const PESO = {interativa: 8, secao: 6, figura: 4, tabela: 4, sub: 3};
const SUGESTOES = [
  ["Quanta água a minha cobertura capta?", "captação cobertura"],
  ["Que volume de cisterna escolher?", "volume ideal"],
  ["Quando o investimento se paga?", "tempo de retorno"],
  ["A economia de água reduz a fatura?", "regime de mínimo"],
  ["Quanto carbono o sistema evita?", "carbono ciclo de vida"],
  ["Que qualidade o uso exige?", "classes de qualidade"],
];
let selecionado = -1;

function destino(i) { return "#/" + i.id + (i.a ? "/" + i.a : ""); }

function sugerir() {
  const caixa = $("#resultados");
  caixa.innerHTML = `<div class="dica-busca">Procure por assunto, por nome de figura ou por «Tabela 83». Ou comece por uma destas:</div>` +
    SUGESTOES.map(([pergunta, termo]) =>
      `<button type="button" class="sugestao" data-q="${esc(termo)}">${esc(pergunta)}</button>`).join("");
  caixa.hidden = false;
  caixa.querySelectorAll(".sugestao").forEach(b => b.addEventListener("click", () => {
    $("#busca").value = b.dataset.q;
    buscar(b.dataset.q);
    $("#busca").focus();
  }));
}

function buscar(q) {
  const caixa = $("#resultados");
  const termos = semAcento(q.toLowerCase()).split(/\s+/).filter(t => t.length > 1);
  if (!termos.length) { sugerir(); return; }
  const achados = [];
  INDICE.forEach(i => {
    let pontos = 0;
    for (const t of termos) {
      const noNome = i.nn.includes(t), noTexto = i.xn.split(t).length - 1;
      if (!noNome && !noTexto) { pontos = 0; break; }
      pontos += (noNome ? 18 + (PESO[i.t] || 3) : 0) + Math.min(noTexto, 10);
    }
    if (pontos) achados.push([pontos, i]);
  });
  achados.sort((a, b) => b[0] - a[0] || (PESO[b[1].t] || 0) - (PESO[a[1].t] || 0));
  selecionado = -1;
  if (!achados.length) {
    caixa.innerHTML = `<div class="vazio">Nada encontrado para «${esc(q)}». A busca cobre o texto das seções, os títulos internos, as figuras e as tabelas.</div>`;
    caixa.hidden = false;
    return;
  }
  caixa.innerHTML = achados.slice(0, 10).map(([, i]) => {
    const [rotulo, classe] = TIPOS[i.t] || TIPOS.secao;
    let trecho = "";
    if (i.x) {
      const pos = i.xn.indexOf(termos[0]);
      trecho = pos >= 0 ? i.x.slice(Math.max(0, pos - 60), pos + 120) : i.x.slice(0, 150);
    } else {
      trecho = i.n;
    }
    trecho = esc(trecho);
    termos.forEach(t => {
      const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      trecho = trecho.replace(re, "<mark>$1</mark>");
    });
    const secao = POR_ID[i.id];
    return `<a href="${destino(i)}"><b><span class="selo ${classe}">${rotulo}</span>${esc(i.r)} · ${esc(i.n)}</b>` +
      `<span>${i.x ? "…" + trecho + "…" : (secao ? "em " + esc(secao.rotulo) + " " + esc(secao.titulo) : "")}</span></a>`;
  }).join("");
  caixa.hidden = false;
}
$("#busca").addEventListener("input", e => buscar(e.target.value));
$("#busca").addEventListener("focus", e => { if (!e.target.value.trim()) sugerir(); });
$("#busca").addEventListener("keydown", e => {
  const itens = [...$("#resultados").querySelectorAll("a")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!itens.length) return;
    selecionado = (selecionado + (e.key === "ArrowDown" ? 1 : -1) + itens.length) % itens.length;
    itens.forEach((a, k) => a.classList.toggle("sel", k === selecionado));
    itens[selecionado].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter" && itens.length) {
    location.hash = itens[Math.max(0, selecionado)].getAttribute("href");
    fecharBusca();
  } else if (e.key === "Escape") fecharBusca();
});
function fecharBusca() { $("#resultados").hidden = true; $("#busca").value = ""; $("#busca").blur(); }
document.addEventListener("click", e => { if (!e.target.closest(".busca")) $("#resultados").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#busca").focus(); } });

/* página inicial */
function inicio() {
  const v = DADOS.volumes;
  const interativas = Object.keys(DADOS.onde_interativas || {}).length;
  const fatos = [
    ["Versão", `<a href="#/versoes" style="color:inherit">${DADOS.versao}</a>`], ["Base climática", "652 cidades"],
    ["Seções no manual", fmt(DADOS.secoes)], ["Figuras no manual", fmt(DADOS.figuras)],
    ["Figuras interativas", fmt(interativas)],
    ["Verificações automáticas", DADOS.testes ? fmt(DADOS.testes) : "—"],
  ];
  const noFluxo = [
    ["Chuva diária", "série de 30 anos", "2.4", 20, 40],
    ["Descarte", "primeiras águas", "2.1", 190, 40],
    ["Cisterna", "balanço YAS, dia a dia", "2.1", 360, 40],
    ["Consumo pluvial", "até a demanda do dia", "2.1", 530, 40],
    ["Volume ideal", "varredura e ganho marginal", "2.2", 20, 150],
    ["Indicadores", "potencial · dias plenos", "2.3", 190, 150],
    ["Fatura e VPL", "tarifa do município", "2.7", 360, 150],
    ["Carbono", "ciclo de vida", "2.8", 530, 150],
    ["Decisão", "TOPSIS · SMAA-VIKOR", "2.10", 700, 95],
  ];
  const caixa = (t, s, id, x, y) => `<a class="no" href="#/${id}"><rect x="${x}" y="${y}" width="150" height="52" rx="9"/><text x="${x + 12}" y="${y + 22}">${t}</text><text class="sub" x="${x + 12}" y="${y + 39}">${s}</text></a>`;
  const seta = (x1, y1, x2, y2) => `<path class="seta" d="M${x1} ${y1} L${x2} ${y2}" marker-end="url(#ponta)"/>`;
  $("#app").innerHTML = `
  <section class="hero">
    <div class="hero-in">
      <div>
        <p class="eyebrow">Programa de simulação · UFSC</p>
        <h1>Aproveitamento de água de chuva, simulado dia a dia</h1>
        <p class="lead">O Triton simula o balanço diário de uma cisterna com a série de chuva do lugar e responde quanto de água potável o sistema economiza, quanto custa, quanto carbono evita e que volume escolher. Esta documentação traz o método, o tutorial, os guias e as referências — as mesmas do manual em PDF.</p>
        <div class="botoes">
          <a class="botao cheio" href="#/4.1">Começar pelo tutorial</a>
          <a class="botao" href="#/2.1">Ler o método</a>

    }).join("")}<a class="volume" href="pdf/Manual-Triton.pdf" target="_blank" rel="noopener" style="--c:#8ecae6"><div class="painel" style="background-image:url('img/capa_completo.jpg')"><b style="color:#8ecae6">PDF</b></div><div class="txt"><h3>Manual completo</h3><p>Os sete volumes num só arquivo, com sumário, índice de figuras e todas as referências.</p></div></a></div>

    <div class="curva">

        <div class="controle"><label for="c-volume">Volume da cisterna <output id="o-volume"></output></label><input id="c-volume" type="range" min="0" max="${DADOS.curva.volumes.length - 1}" step="1"></div>

  <section class="faixa">

      <defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" style="fill:var(--ink3)"/></marker></defs>
      ${seta(170, 66, 188, 66)}${seta(340, 66, 358, 66)}${seta(510, 66, 528, 66)}
      ${seta(435, 92, 435, 118)}<text class="rotulo" x="442" y="110">extravasa</text>
      ${seta(95, 92, 95, 148)}<text class="rotulo" x="102" y="124">para cada volume</text>
      ${seta(170, 176, 188, 176)}${seta(340, 176, 358, 176)}${seta(510, 176, 528, 176)}
      ${seta(680, 66, 698, 112)}${seta(680, 176, 698, 130)}
      ${noFluxo.map(n => caixa(...n)).join("")}
    </svg></div>
  </section>

  <section class="faixa">
    <h2>Princípios da documentação</h2>
    <div class="principios">
      <div class="principio"><h3>Todo número é calculado</h3><p>Tabelas e figuras saem do próprio programa, e cada valor impresso tem uma verificação automática. Uma correção no código não deixa o texto mentindo.</p></div>
      <div class="principio"><h3>Fonte declarada</h3><p>Normas, fatores de emissão, tarifas e catálogos de fabricante aparecem com a origem, a edição e o item. O que é premissa do programa é dito como premissa.</p></div>
      <div class="principio"><h3>Uma fonte, três formatos</h3><p>O manual completo, os sete volumes e este site são montados das mesmas partes. A numeração das seções e das equações é a mesma em todos.</p></div>
      <div class="principio"><h3>Limites às claras</h3><p>O que o modelo não faz — calhas, perda de carga real, amortecimento de cheias — está escrito, com a norma ou a ferramenta que faz.</p></div>
    </div>

  <section class="faixa">
    <h2>O manual em PDF</h2>
    <div class="pdfs"><a href="pdf/Manual-Triton.pdf" target="_blank" rel="noopener" style="--c:#8ecae6"><i></i>Manual completo</a>${v.map(x => `<a href="pdf/Manual-Triton-${x.arquivo}.pdf" target="_blank" rel="noopener" style="--c:${x.cor}"><i></i>${esc(x.titulo)}</a>`).join("")}</div>
  </section>

}

function rodape() {
  return `<footer class="rodape"><span>Igor Catão Martins Vaz e Enedir Ghisi · Grupo de Pesquisa em Ambientes Sustentáveis · Universidade Federal de Santa Catarina</span><span><a href="#/versoes">Triton ${DADOS.versao}</a> · licença acadêmica, uso não comercial · revisão de ${DADOS.revisao}</span></footer>`;
}

/* a curva */
let fi = 0, vi = 0;
function iniciarCurva() {
  const C = DADOS.curva;
  fi = Math.max(0, C.fracoes.findIndex(f => Math.abs(f - 0.28) < 1e-6));
  vi = Math.max(0, C.volumes.indexOf(4000));
  $("#c-fracao").value = fi; $("#c-volume").value = vi;
  $("#c-fracao").addEventListener("input", e => { fi = +e.target.value; desenharCurva(); });
  $("#c-volume").addEventListener("input", e => { vi = +e.target.value; desenharCurva(); });
  desenharCurva();
  const svg = $("#grafico"), dica = $("#dica");
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 640;
    const k = Math.round((x - 56) / (640 - 56 - 16) * (C.volumes.length - 1));
    if (k < 0 || k >= C.volumes.length) { dica.hidden = true; return; }
    const linha = C.grade[C.fracoes[fi].toFixed(2)][k];
    dica.innerHTML = `${fmt(C.volumes[k])} L · <b>${fmt(linha[0], 2)}%</b>`;
    dica.hidden = false;
    dica.style.left = (e.pageX + 14) + "px"; dica.style.top = (e.pageY - 34) + "px";
    const g = $("#guia");
    if (g) { const px = 56 + k / (C.volumes.length - 1) * (640 - 72); g.setAttribute("x1", px); g.setAttribute("x2", px); g.style.display = ""; }
  });
  svg.addEventListener("pointerleave", () => { dica.hidden = true; const g = $("#guia"); if (g) g.style.display = "none"; });
  svg.addEventListener("click", e => {
    const r = svg.getBoundingClientRect();
    const k = Math.round(((e.clientX - r.left) / r.width * 640 - 56) / (640 - 72) * (C.volumes.length - 1));
    if (k >= 0 && k < C.volumes.length) { vi = k; $("#c-volume").value = k; desenharCurva(); }
  });
}
function desenharCurva() {
  const svg = $("#grafico");
  if (!svg) return;
  const C = DADOS.curva, f = C.fracoes[fi], linhas = C.grade[f.toFixed(2)];
  const W = 640, H = 320, E = 56, D = 16, T = 18, B = 42;
  const ymax = 60, xmax = C.volumes[C.volumes.length - 1];
  const X = v => E + v / xmax * (W - E - D), Y = p => T + (1 - p / ymax) * (H - T - B);
  let s = "";
  for (let p = 0; p <= ymax; p += 10) s += `<line class="grade" x1="${E}" x2="${W - D}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${E - 8}" y="${Y(p) + 4}" text-anchor="end">${p}%</text>`;
  for (let v = 0; v <= xmax; v += 5000) s += `<text x="${X(v)}" y="${H - B + 18}" text-anchor="middle">${fmt(v / 1000)} m³</text>`;
  s += `<text x="${(E + W - D) / 2}" y="${H - 6}" text-anchor="middle">volume da cisterna</text>`;
  s += `<line class="eixo" x1="${E}" x2="${W - D}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  const teto = f * 100;
  s += `<line class="teto" x1="${E}" x2="${W - D}" y1="${Y(teto)}" y2="${Y(teto)}"/><text x="${W - D}" y="${Y(teto) - 6}" text-anchor="end">teto: fração atendível de ${fmt(teto)}%</text>`;
  const pts = linhas.map((l, k) => `${X(C.volumes[k])},${Y(l[0])}`).join(" ");
  s += `<polygon class="area" points="${X(0)},${Y(0)} ${pts} ${X(xmax)},${Y(0)}"/>`;
  s += `<polyline class="serie" points="${pts}"/>`;
  s += `<line id="guia" class="guia" x1="0" x2="0" y1="${T}" y2="${Y(0)}" style="display:none"/>`;
  const atual = linhas[vi];
  s += `<circle class="ponto" cx="${X(C.volumes[vi])}" cy="${Y(atual[0])}" r="6"/>`;
  svg.innerHTML = s;
  const ganho = vi > 0 ? (atual[0] - linhas[vi - 1][0]) / ((C.volumes[vi] - C.volumes[vi - 1]) / 1000) : null;
  $("#o-fracao").textContent = fmt(teto) + "%";
  $("#o-volume").textContent = fmt(C.volumes[vi]) + " L";
  $("#l-pot").textContent = fmt(atual[0], 2) + "%";
  $("#l-teto").textContent = "de " + fmt(teto) + "%";
  $("#l-dias").textContent = fmt(atual[1], 1) + "%";
  $("#l-extra").textContent = fmt(atual[2]);
  $("#l-ganho").textContent = ganho === null ? "—" : fmt(ganho, 2);
}

/* página de versões */
function paginaVersoes() {
  const versoes = DADOS.versoes || [];
  const secaoDoManual = SECOES.find(s => s.titulo.toLowerCase().startsWith("histórico de versões"));
  const corpo = versoes.map((v, i) => `
    <article class="versao">
      <div class="versao-topo">
        <h3>Versão ${esc(v.versao)}</h3>
        <span class="data">${esc(v.data)}</span>
        ${i === 0 ? '<span class="atual">versão atual</span>' : ""}
      </div>
      ${v.resumo ? `<p class="resumo">${esc(v.resumo)}</p>` : ""}
      <div class="contagem">
        <span><b>${fmt(v.altera_resultados)}</b> ${v.altera_resultados === 1 ? "correção que altera resultados" : "correções que alteram resultados"}</span>
        <span><b>${fmt(v.nao_altera_resultados)}</b> ${v.nao_altera_resultados === 1 ? "correção sem efeito no resultado" : "correções sem efeito no resultado"}</span>
      </div>
      ${(v.secoes || []).map((sec, k) => `<details${k === 0 ? " open" : ""}><summary>${esc(sec.titulo)}</summary><div class="corpo">${sec.html}</div></details>`).join("")}
    </article>`).join("");

  $("#app").innerHTML = `<div class="doc so-texto" style="--c:var(--accent)">
    <article class="conteudo">
      <div class="trilha"><a href="#/">Documentação</a> / Versões</div>
      <h1>O que mudou em cada versão</h1>
      <div class="chips"><span class="chip">Triton ${esc(DADOS.versao)}</span><span class="chip">${fmt(versoes.length)} ${versoes.length === 1 ? "versão publicada" : "versões publicadas"}</span></div>
      <p class="sub" style="max-width:74ch">Cada versão traz as mesmas seções: o resumo, as novidades, as correções que
      alteram resultados de estudos já feitos, as que não alteram e o que mudou na documentação.
      ==A distinção entre os dois tipos de correção é a que decide se um estudo anterior precisa ser refeito.==
      Este registro, o arquivo <code>CHANGELOG.md</code> distribuído com o código e o capítulo do manual saem do mesmo texto.</p>
      <div class="versoes">${corpo || "<p>Nenhuma versão registrada.</p>"}</div>
      ${secaoDoManual ? `<div class="passos"><a class="prox" href="#/${secaoDoManual.id}"><small>No manual</small>${esc(secaoDoManual.rotulo)} ${esc(secaoDoManual.titulo)}</a></div>` : ""}
    </article>
  </div>${rodape()}`;
  $(".conteudo .sub").innerHTML = $(".conteudo .sub").innerHTML.replace(/==(.+?)==/g, "<mark>$1</mark>");
  document.title = "Versões · Triton";
  window.scrollTo(0, 0);
}

/* página de seção */
function secao(id, ancora) {
  const s = POR_ID[id];
  if (!s) { location.hash = "#/"; return; }
  const cap = s.cap, cor = corDe(cap);
  const idx = SECOES.indexOf(s), ant = SECOES[idx - 1], prox = SECOES[idx + 1];
  const vol = DADOS.volumes.find(v => v.capitulo === cap.n);
  const lateral = DADOS.capitulos.map(c => `<div class="cap" style="--c:${corDe(c)}"><button type="button" aria-expanded="${c === cap}"><i></i>${c.apendice ? "" : c.n + " · "}${esc(c.titulo)}</button><ul${c === cap ? "" : " hidden"}>${c.secoes.map(x => `<li><a href="#/${x.id}" class="${x === s ? "ativo" : ""}">${esc(x.rotulo)} ${esc(x.titulo)}${INTERATIVAS_DA_SECAO[x.id] ? `<b class="marca-i" title="${INTERATIVAS_DA_SECAO[x.id].length} figura(s) interativa(s) nesta seção">interativa</b>` : ""}</a></li>`).join("")}</ul></div>`).join("");
  const daSecao = INTERATIVAS_DA_SECAO[id] || [];
  const atalhos = daSecao.length ? `<p class="nesta-i"><b>Para experimentar:</b> ${daSecao.map(o =>
    `<a href="#/${id}/fig-${o.numero}">${esc((FI[o.arquivo] || {}).pergunta || ("Figura " + o.numero))}</a>`).join(" ")}</p>` : "";
  const nesta = (s.toc.length || daSecao.length) ? `<nav class="nesta" aria-label="Nesta página">${s.toc.length ? `<b>Nesta página</b><ol>${s.toc.map(t => `<li><a href="#/${id}/${t.id}">${esc(t.titulo)}</a></li>`).join("")}</ol>` : ""}${atalhos}</nav>` : "";
  const tabelas = s.html.replace(/<table>/g, '<div class="tabela"><table>').replace(/<\/table>/g, "</table></div>");
  $("#app").innerHTML = `<div class="doc" style="--c:${cor}">
    <aside class="lateral" aria-label="Sumário">${lateral}</aside>
    <article class="conteudo">
      <div class="trilha"><a href="#/">Documentação</a> / ${esc(cap.apendice ? cap.titulo : cap.n + ". " + cap.titulo)}</div>
      <h1><span class="num">${esc(s.rotulo)}</span>${esc(s.titulo)}</h1>
      <div class="chips">${vol ? `<span class="chip vol">Volume ${esc(vol.titulo)}</span>` : ""}<span class="chip">Triton ${DADOS.versao}</span><span class="chip">Revisão de ${DADOS.revisao}</span></div>
      ${nesta}
      <div class="texto">${tabelas}</div>
      <div class="passos">${ant ? `<a href="#/${ant.id}"><small>Anterior</small>${esc(ant.rotulo)} ${esc(ant.titulo)}</a>` : ""}${prox ? `<a class="prox" href="#/${prox.id}"><small>Próxima</small>${esc(prox.rotulo)} ${esc(prox.titulo)}</a>` : ""}</div>
    </article>
  </div>${rodape()}`;
  document.querySelectorAll(".lateral .cap > button").forEach(b => b.addEventListener("click", () => {
    const ul = b.nextElementSibling; ul.hidden = !ul.hidden; b.setAttribute("aria-expanded", String(!ul.hidden));
  }));
  montarInterativas($(".texto"));
  document.title = `${s.rotulo} ${s.titulo} · Triton`;
  if (ancora) {
    const alvo = document.getElementById(ancora);
    if (alvo) { alvo.scrollIntoView({block: "start"}); window.scrollBy(0, -70); alvo.classList.add("alvo"); return; }
  }
  window.scrollTo(0, 0);
  const lat = $(".lateral a.ativo");
  if (lat) lat.scrollIntoView({block: "center"});
}

/* rotas */
function rota() {
  const h = location.hash.replace(/^#\/?/, "");
  const [id, ancora] = h.split("/");
  document.querySelectorAll("#nav a").forEach(a => {
    const alvo = a.dataset.h.replace("#/", "");
    const s = POR_ID[id];
    a.classList.toggle("ativo", alvo === "" ? !id : alvo === "interativas" ? id === "interativas" : !!(s && POR_ID[alvo] && POR_ID[alvo].cap === s.cap));
  });
  if (id === "versoes") { paginaVersoes(); return; }
  if (!id || id === "interativas") {
    document.title = "Documentação do Triton"; inicio();
    const g = id && document.getElementById("interativas");
    if (g) { g.scrollIntoView({block: "start"}); window.scrollBy(0, -64); } else window.scrollTo(0, 0);
    return;
  }
  secao(decodeURIComponent(id), ancora);
}
(function () {
  const selo = $("#selo-versao");
  if (selo) selo.textContent = "v" + DADOS.versao;
})();
window.addEventListener("hashchange", rota);
rota();
</script>
